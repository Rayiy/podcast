<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小宇宙一起听</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; text-align: center; background: #f5f5f5; color: #333; }
        input { width: 70%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #ff5c5c; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button.secondary { background: #666; font-size: 14px; padding: 5px 10px; margin-bottom: 20px; }
        #player-container { margin-top: 20px; display: none; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        img { width: 150px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        h3 { margin: 10px 0; font-size: 18px; }
        audio { width: 100%; margin-top: 20px; outline: none; }
        .room-info { background: #e0e0e0; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .status { color: #888; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>📻 小宇宙一起听</h2>

    <div class="room-info">
        当前房间号: <strong id="roomIdDisplay">...</strong>
        <br>
        <button class="secondary" onclick="copyLink()">🔗 复制邀请链接</button>
    </div>

    <div>
        <input type="text" id="urlInput" placeholder="粘贴小宇宙单集链接 (https://...)">
        <button onclick="parseUrl()">加载播客</button>
    </div>

    <div id="player-container">
        <img id="cover" src="" alt="Cover">
        <h3 id="title">博客标题</h3>
        <audio id="audioPlayer" controls></audio>
        <p class="status">状态: <span id="syncStatus">等待操作...</span></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const audio = document.getElementById('audioPlayer');
        let isRemoteUpdate = false;
        let roomId = null;

        // 🟢 1. 初始化：处理房间逻辑
        function initRoom() {
            const params = new URLSearchParams(window.location.search);
            roomId = params.get('room');

            // 如果 URL 里没有房间号，生成一个随机的，并更新 URL
            if (!roomId) {
                roomId = Math.random().toString(36).substring(2, 8);
                const newUrl = window.location.pathname + '?room=' + roomId;
                window.history.replaceState({path: newUrl}, '', newUrl);
            }

            document.getElementById('roomIdDisplay').innerText = roomId;
            
            // 告诉服务器我加入了这个房间
            socket.emit('join_room', roomId);
        }

        // 🟢 2. 复制链接功能
        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('链接已复制！发给朋友即可加入房间');
            });
        }

        // 🟢 3. 解析 URL (没变)
        async function parseUrl() {
            const url = document.getElementById('urlInput').value;
            if(!url) return alert('请输入链接');
            
            const res = await fetch('/api/parse', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url })
            });
            const data = await res.json();
            
            if(data.success) {
                socket.emit('new_track', data); // 发送时服务器会自动识别 socket.data.roomId
            } else {
                alert('解析失败: ' + data.message);
            }
        }

        // 🟢 4. Socket 监听逻辑 (基本没变)
        socket.on('sync_track', (data) => {
            document.getElementById('player-container').style.display = 'block';
            document.getElementById('title').innerText = data.title;
            document.getElementById('cover').src = data.cover;
            
            if(audio.src !== data.audioUrl) {
                audio.src = data.audioUrl;
            }
        });

        socket.on('sync_action', (data) => {
            isRemoteUpdate = true;
            const diff = Math.abs(audio.currentTime - data.time);
            document.getElementById('syncStatus').innerText = `同步中: ${data.type}`;
            if (diff > 2) audio.currentTime = data.time;
            if (data.type === 'play') audio.play().catch(e => {});
            else if (data.type === 'pause') audio.pause();
            setTimeout(() => { isRemoteUpdate = false; }, 500);
        });

        // 🟢 5. 播放器事件监听 (没变)
        audio.addEventListener('play', () => {
            if (!isRemoteUpdate) socket.emit('player_action', { type: 'play', time: audio.currentTime });
        });
        audio.addEventListener('pause', () => {
            if (!isRemoteUpdate) socket.emit('player_action', { type: 'pause', time: audio.currentTime });
        });
        audio.addEventListener('seeked', () => {
            if (!isRemoteUpdate) socket.emit('player_action', { type: 'seek', time: audio.currentTime });
        });

        // 启动！
        initRoom();

    </script>
</body>
</html>
